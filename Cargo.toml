[package]
name = "motd-rs"
version = "0.1.7"
edition = "2021"
repository = "https://github.com/unicodick/motd-rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = [
  "now",
  "std",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }

[profile.release]
strip = "symbols"
